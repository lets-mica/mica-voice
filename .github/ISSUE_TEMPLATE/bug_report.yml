name: "🐛 Bug 报告"
description: "复现 mica-voice 代码本身的 Bug（识别错误、native 崩溃、装配失败等）。使用问题请用「问题咨询」模板。"
labels: ["bug"]
body:
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - "Windows"
        - "Linux"
        - "macOS"
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: CPU 架构
      options:
        - "x86_64 / amd64"
        - "arm64 / aarch64"
        - "x86 (32-bit)"
        - "其它"
    validations:
      required: true
  - type: dropdown
    id: java
    attributes:
      label: JDK 版本
      options:
        - "JDK 8"
        - "JDK 11"
        - "JDK 17"
        - "JDK 21"
        - "JDK 25+"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 出问题的组件
      options:
        - "mica-voice-core"
        - "mica-voice-spring-boot-starter"
        - "mica-voice-example-console"
        - "mica-voice-example-spring-web"
        - "models/scripts/ 下载脚本"
    validations:
      required: true
  - type: dropdown
    id: capability
    attributes:
      label: 出问题的能力
      multiple: true
      options:
        - "离线 ASR（Paraformer / SenseVoice / Whisper）"
        - "在线流式 ASR（Streaming Paraformer / X-ASR）"
        - "TTS 语音合成"
        - "声纹识别"
        - "VAD 语音活动检测"
        - "说话人分离（Diarization）"
        - "关键词唤醒（KWS）"
        - "音频降噪（Denoise）"
        - "WebSocket 流式 ASR"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mica-voice 版本
      placeholder: "1.0.0-SNAPSHOT"
    validations:
      required: true
  - type: input
    id: sherpa-version
    attributes:
      label: mica-sherpa-onnx 版本
      placeholder: "1.13.5"
  - type: dropdown
    id: model-type
    attributes:
      label: 使用的模型（多选请按字母序选最近的）
      options:
        - "sherpa-onnx-paraformer-zh-small-2024-03-09（Paraformer zh）"
        - "sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17（SenseVoice）"
        - "x-asr-zh-en-chunk-960ms（X-ASR 960ms）"
        - "sherpa-onnx-streaming-paraformer-bilingual-zh-en（流式 Paraformer）"
        - "vits-icefall-zh-aishell3（VITS 单说话人）"
        - "vits-zh-hf-fanchen-C（VITS 187 说话人）"
        - "3dspeaker_speech_eres2net_*（声纹 embedding）"
        - "sherpa-onnx-pyannote-segmentation-3-0.onnx（diarization segmentation）"
        - "silero_vad.onnx / ten_vad.onnx"
        - "sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01（KWS）"
        - "sherpa-onnx-gtcrn.onnx / dpdfnet"
        - "其它 / 自定义"
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: |
        提供最小复现代码或 curl 命令。WebSocket 类问题请注明：
          - 浏览器 + 版本
          - 是否 HTTPS / localhost
          - 是否使用示例 static/index.html
      placeholder: |
        1. 准备模型：bash models/scripts/download-models.sh asr
        2. 运行：java -jar mica-voice-example-console.jar asr
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: stack
    attributes:
      label: 完整异常堆栈
      description: 不要只贴 exception.getMessage()，完整的 cause 链才有信息量
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: mica.voice.* 配置（脱敏后）
      placeholder: |
        mica:
          voice:
            models-dir: /opt/mica/models
            threads: 2
            asr:
              offline:
                model-dir-name: sherpa-onnx-paraformer-zh-small-2024-03-09
                model-type: PARAFORMER
  - type: textarea
    id: models-ls
    attributes:
      label: 模型目录列表（ls models/）
      description: 用于核对模型文件是否齐全
      placeholder: |
        $ ls -la models/
        sherpa-onnx-paraformer-zh-small-2024-03-09/
        silero_vad.onnx
        0-four-speakers-zh.wav
  - type: textarea
    id: logs
    attributes:
      label: 启动日志（关键 30 行）
      description: 贴 mica-voice 装配阶段的 INFO/WARN；native UnsatisfiedLinkError 等
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前自检
      options:
        - label: 已用 models/scripts/download-models.sh 下载对应模型
          required: true
        - label: 已搜索现有 issue / discussions，未发现重复
          required: true
        - label: 异常堆栈是完整的（含 cause）
          required: true
        - label: 操作系统、CPU 架构、JDK、mica-voice 版本均已填写
          required: true
