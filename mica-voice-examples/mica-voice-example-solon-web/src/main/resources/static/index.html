<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mica-voice Solon 控制台</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
               background: #f6f8fa; color: #1f2328; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: #1f2328; color: #fff; padding: 20px 0; }
        .sidebar h1 { font-size: 18px; padding: 0 20px; margin: 0 0 8px; }
        .sidebar .version { padding: 0 20px; font-size: 12px; color: #8b949e; margin-bottom: 20px; }
        .nav-item { display: block; padding: 10px 20px; color: #c9d1d9; cursor: pointer; border-left: 3px solid transparent; }
        .nav-item:hover { background: #161b22; }
        .nav-item.active { background: #161b22; color: #58a6ff; border-left-color: #58a6ff; }
        .main { flex: 1; padding: 30px; max-width: 980px; }
        .panel { display: none; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 24px; }
        .panel.active { display: block; }
        .panel h2 { margin-top: 0; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input[type="text"], input[type="number"], input[type="file"], textarea, select {
            width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px;
            font-size: 14px; font-family: inherit;
        }
        textarea { min-height: 80px; resize: vertical; }
        button { background: #1f6feb; color: #fff; border: 0; padding: 8px 16px; border-radius: 6px;
                 cursor: pointer; font-size: 14px; font-weight: 600; }
        button:hover { background: #1858c4; }
        button:disabled { background: #8c959f; cursor: not-allowed; }
        button.secondary { background: #6e7681; }
        button.danger { background: #cf222e; }
        .result { margin-top: 16px; padding: 12px; background: #f6f8fa; border-radius: 6px;
                  border: 1px solid #d0d7de; font-family: ui-monospace, monospace; font-size: 13px;
                  white-space: pre-wrap; word-break: break-all; }
        .audio-player { margin-top: 12px; }
        .row { display: flex; gap: 12px; align-items: center; }
        .row > * { flex: 1; }
        .hint { font-size: 12px; color: #656d76; margin-top: 4px; }
        .info-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .info-table th, .info-table td { padding: 8px 12px; border-bottom: 1px solid #d0d7de; text-align: left; }
        .info-table th { background: #f6f8fa; font-weight: 600; }
        .ok { color: #1a7f37; }
        .fail { color: #cf222e; }
        .speaker-list { margin-top: 8px; padding: 8px; background: #f6f8fa; border-radius: 6px;
                        font-family: ui-monospace, monospace; font-size: 13px; min-height: 30px; }
        code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .badge { display: inline-block; background: #ddf4ff; color: #0969da; padding: 2px 8px;
                 border-radius: 12px; font-size: 12px; margin-left: 8px; }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h1>mica-voice <span class="badge">Solon</span></h1>
        <div class="version">v1.0 控制台</div>
        <div class="nav-item active" data-panel="asr">🎙 语音识别 ASR</div>
        <div class="nav-item" data-panel="tts">🔊 语音合成 TTS</div>
        <div class="nav-item" data-panel="speaker">👤 声纹识别</div>
        <div class="nav-item" data-panel="info">⚙ 模型信息</div>
    </aside>

    <main class="main">
        <!-- ASR -->
        <section class="panel active" id="panel-asr">
            <h2>语音识别（ASR）</h2>
            <p>上传一个 <code>wav</code>（单声道 16-bit，16kHz 最佳），后端会用 sherpa-onnx OfflineRecognizer 识别。</p>
            <div class="form-group">
                <label>音频文件</label>
                <input type="file" id="asr-file" accept=".wav,audio/wav">
            </div>
            <button onclick="asrRecognize()">识别</button>
            <div class="result" id="asr-result" style="display:none"></div>
        </section>

        <!-- TTS -->
        <section class="panel" id="panel-tts">
            <h2>语音合成（TTS）</h2>
            <div class="form-group">
                <label>文本</label>
                <textarea id="tts-text">大家好，我是 mica-voice，一个开源的 Java 声音 AI 全家桶。</textarea>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>说话人 id</label>
                    <input type="number" id="tts-speaker" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>语速</label>
                    <input type="number" id="tts-speed" value="1.0" step="0.1" min="0.5" max="2.0">
                </div>
            </div>
            <button onclick="ttsSynthesize()">合成</button>
            <div class="audio-player" id="tts-player" style="display:none">
                <audio id="tts-audio" controls></audio>
            </div>
            <div class="result" id="tts-result" style="display:none"></div>
        </section>

        <!-- Speaker -->
        <section class="panel" id="panel-speaker">
            <h2>声纹识别</h2>
            <div class="form-group">
                <label>说话人名字（enroll 时必填）</label>
                <input type="text" id="speaker-name" placeholder="alice">
            </div>
            <div class="form-group">
                <label>音频文件（enroll / verify / search 通用）</label>
                <input type="file" id="speaker-file" accept=".wav,audio/wav">
            </div>
            <div class="row">
                <button onclick="speakerEnroll()">注册 enroll</button>
                <button class="secondary" onclick="speakerVerify()">1:1 验证</button>
                <button class="secondary" onclick="speakerSearch()">1:N 搜索</button>
            </div>
            <div class="form-group" style="margin-top:16px">
                <button class="danger" onclick="speakerRefresh()">刷新列表</button>
            </div>
            <h3 style="margin-bottom:8px">已注册说话人</h3>
            <div class="speaker-list" id="speaker-list">（无）</div>
            <div class="result" id="speaker-result" style="display:none"></div>
        </section>

        <!-- Info -->
        <section class="panel" id="panel-info">
            <h2>模型信息</h2>
            <p>当前 mica-voice 装配状态（来自 <code>mica.voice.*</code> 配置）。</p>
            <table class="info-table">
                <tbody id="info-tbody">
                <tr><td colspan="2">加载中...</td></tr>
                </tbody>
            </table>
            <h3 style="margin-top:24px">models/ 子目录</h3>
            <div class="speaker-list" id="models-list">加载中...</div>
        </section>
    </main>
</div>

<script>
    // 切换 panel
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
            item.classList.add('active');
            document.getElementById('panel-' + item.dataset.panel).classList.add('active');
            if (item.dataset.panel === 'speaker') speakerRefresh();
            if (item.dataset.panel === 'info') loadInfo();
        });
    });

    function show(id, text, isOk) {
        const el = document.getElementById(id);
        el.style.display = 'block';
        el.className = 'result' + (isOk === false ? ' fail' : (isOk === true ? ' ok' : ''));
        if (typeof text === 'string') {
            el.textContent = text;
        } else {
            el.textContent = JSON.stringify(text, null, 2);
        }
    }

    async function asrRecognize() {
        const file = document.getElementById('asr-file').files[0];
        if (!file) { show('asr-result', '请选择音频文件', false); return; }
        const fd = new FormData();
        fd.append('file', file);
        show('asr-result', '识别中...');
        try {
            const r = await fetch('/mica/voice/asr/recognize', { method: 'POST', body: fd });
            const data = await r.json();
            if (!r.ok) { show('asr-result', data, false); return; }
            show('asr-result', '✅ 识别成功\n\n' + JSON.stringify(data, null, 2), true);
        } catch (e) {
            show('asr-result', '请求失败: ' + e.message, false);
        }
    }

    async function ttsSynthesize() {
        const text = document.getElementById('tts-text').value;
        const speakerId = document.getElementById('tts-speaker').value;
        const speed = document.getElementById('tts-speed').value;
        if (!text) { show('tts-result', '请输入文本', false); return; }
        show('tts-result', '合成中...');
        try {
            const r = await fetch(`/mica/voice/tts/synthesize?text=${encodeURIComponent(text)}&speakerId=${speakerId}&speed=${speed}`);
            if (!r.ok) {
                show('tts-result', '合成失败: HTTP ' + r.status, false);
                return;
            }
            const blob = await r.blob();
            const url = URL.createObjectURL(blob);
            const audio = document.getElementById('tts-audio');
            audio.src = url;
            audio.playbackRate = parseFloat(speed);
            document.getElementById('tts-player').style.display = 'block';
            audio.play().catch(() => {});
            const info = await fetch('/mica/voice/tts/info').then(r => r.json());
            show('tts-result', '✅ 合成成功\n' + JSON.stringify(info, null, 2), true);
        } catch (e) {
            show('tts-result', '请求失败: ' + e.message, false);
        }
    }

    async function speakerEnroll() {
        const name = document.getElementById('speaker-name').value;
        const file = document.getElementById('speaker-file').files[0];
        if (!name) { show('speaker-result', '请输入说话人名字', false); return; }
        if (!file) { show('speaker-result', '请选择音频文件', false); return; }
        const fd = new FormData();
        fd.append('name', name);
        fd.append('file', file);
        show('speaker-result', '注册中...');
        try {
            const r = await fetch('/mica/voice/speaker/enroll', { method: 'POST', body: fd });
            const data = await r.json();
            if (!r.ok) { show('speaker-result', data, false); return; }
            show('speaker-result', '✅ ' + JSON.stringify(data, null, 2), true);
            speakerRefresh();
        } catch (e) {
            show('speaker-result', '请求失败: ' + e.message, false);
        }
    }

    async function speakerVerify() {
        const name = document.getElementById('speaker-name').value;
        const file = document.getElementById('speaker-file').files[0];
        if (!name) { show('speaker-result', '请输入说话人名字', false); return; }
        if (!file) { show('speaker-result', '请选择音频文件', false); return; }
        const fd = new FormData();
        fd.append('name', name);
        fd.append('file', file);
        show('speaker-result', '验证中...');
        try {
            const r = await fetch('/mica/voice/speaker/verify', { method: 'POST', body: fd });
            const data = await r.json();
            if (!r.ok) { show('speaker-result', data, false); return; }
            show('speaker-result', (data.matched ? '✅ 同一人' : '❌ 不是同一人') + '\n' + JSON.stringify(data, null, 2), data.matched);
        } catch (e) {
            show('speaker-result', '请求失败: ' + e.message, false);
        }
    }

    async function speakerSearch() {
        const file = document.getElementById('speaker-file').files[0];
        if (!file) { show('speaker-result', '请选择音频文件', false); return; }
        const fd = new FormData();
        fd.append('file', file);
        show('speaker-result', '搜索中...');
        try {
            const r = await fetch('/mica/voice/speaker/search', { method: 'POST', body: fd });
            const data = await r.json();
            if (!r.ok) { show('speaker-result', data, false); return; }
            show('speaker-result', (data.matched ? '✅ 匹配到: ' + data.speakerName : '❌ 未匹配') + '\n' + JSON.stringify(data, null, 2), data.matched);
        } catch (e) {
            show('speaker-result', '请求失败: ' + e.message, false);
        }
    }

    async function speakerRefresh() {
        try {
            const r = await fetch('/mica/voice/speaker/names');
            const names = await r.json();
            const el = document.getElementById('speaker-list');
            el.textContent = names.length === 0 ? '（无）' : names.join(', ');
        } catch (e) {
            document.getElementById('speaker-list').textContent = '加载失败: ' + e.message;
        }
    }

    async function loadInfo() {
        try {
            const [info, models] = await Promise.all([
                fetch('/api/info').then(r => r.json()),
                fetch('/api/models').then(r => r.json())
            ]);
            const tbody = document.getElementById('info-tbody');
            tbody.innerHTML = '';
            const rows = [
                ['modelsDir', info.modelsDir + (info.modelsDirExists ? ' ✓' : ' ✗')],
                ['outputDir', info.outputDir],
                ['threads', info.threads],
                ['debug', info.debug],
                ['ASR 离线', `${info.asr.offlineEnabled ? '✅' : '❌'} ${info.asr.offlineModelDirName} (${info.asr.offlineModelType})`],
                ['ASR 在线', `${info.asr.onlineEnabled ? '✅' : '❌'} ${info.asr.onlineModelDirName}`],
                ['TTS', `${info.tts.enabled ? '✅' : '❌'} ${info.tts.modelDirName} (sid=${info.tts.defaultSpeakerId}, speed=${info.tts.defaultSpeed})`],
                ['声纹', `${info.speaker.enabled ? '✅' : '❌'} threshold=${info.speaker.threshold}`]
            ];
            for (const [k, v] of rows) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<th style="width:160px">${k}</th><td>${v}</td>`;
                tbody.appendChild(tr);
            }
            const ml = document.getElementById('models-list');
            ml.textContent = models.subdirs.length === 0 ? '（无）' : models.subdirs.join(', ');
        } catch (e) {
            document.getElementById('info-tbody').innerHTML = '<tr><td colspan="2">加载失败: ' + e.message + '</td></tr>';
        }
    }
</script>
</body>
</html>
