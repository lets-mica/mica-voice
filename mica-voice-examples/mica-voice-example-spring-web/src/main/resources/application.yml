spring:
  application:
    name: mica-voice-example-spring-web
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

logging:
  level:
    net.dreamlu.mica.voice: debug

mica:
  voice:
    # 全局配置
    enabled: true
    models-dir: ./models
    output-dir: ./output
    threads: 2
    debug: false

    # ASR 离线 + 在线
    asr:
      offline:
        enabled: true
        model-dir-name: sherpa-onnx-paraformer-zh-small-2024-03-09
        model-type: PARAFORMER
      online:
        enabled: true                       # WebSocket 流式 ASR Demo 需要打开
        # 模型目录（按需切换）：
        #   x-asr-zh-en-chunk-960ms                          X-ASR（Zipformer Transducer，960ms chunk，推荐）
        #   sherpa-onnx-streaming-paraformer-bilingual-zh-en 流式 Paraformer（需自行下载）
        model-dir-name: x-asr-zh-en-chunk-960ms
        model-type: X_ASR                  # 也可改成 PARAFORMER / ZIPFORMER / ZIPFORMER2_CTC / TRANSDUCER / AUTO
        enable-endpoint: true
        # ===== 端点检测（sherpa-onnx 原生规则，转写 Transducer/X-ASR 时很有用）=====
        # Rule1：最短尾部静音（秒），触发后立即结束一句。默认 2.4s，调小可让"说完了"更快出 final。
        endpoint-rule1-min-trailing-silence: 1.0
        # Rule2：最短尾部静音（秒），兜底规则。默认 1.2s。
        endpoint-rule2-min-trailing-silence: 0.8
        # Rule3：最短语音长度（秒），过短视为噪音不触发。默认 0.2s。
        endpoint-rule3-min-utterance-length: 0.2
        chunk-size: 1600                   # 100ms @ 16kHz

    # TTS
    tts:
      enabled: true
      # 纯中文 → vits-icefall-zh-aishell3（~30MB）
      # 中英混合 → vits-melo-tts-zh_en（~310MB，jieba + espeak-ng-data，需自行 download-models.ps1 -Target tts-zh-en 下载）
      model-dir-name: vits-melo-tts-zh_en
      default-speaker-id: 0
      default-speed: 1.0

    # 声纹
    speaker:
      enabled: true
      threshold: 0.5

    # VAD（v1.1）
    vad:
      enabled: false        # 需要 silero_vad.onnx；开启后才会装配 VadService
      model-file-name: silero_vad.onnx
      sample-rate: 16000
      threshold: 0.5

    # 说话人分离（v1.1）
    diarization:
      enabled: false        # 需要 segmentation + embedding 模型
      segmentation-model-file-name: sherpa-onnx-pyannote-segmentation-3-0.onnx
      embedding-model-file-name: 3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx

    # 关键词唤醒（v1.1）
    kws:
      enabled: false        # 需要 transducer 模型目录 + keywords.txt
      model-dir-name: sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-23

    # 音频降噪（v1.1）
    denoise:
      enabled: false        # 需要 gtcrn / dpdfnet 模型
      model-file-name: sherpa-onnx-gtcrn.onnx

# 启动后由 mica-voice-example-spring-web 自身的 @RestController 暴露端点：
#   POST /mica/voice/asr/recognize        file=@input.wav
#   GET  /mica/voice/tts/synthesize       ?text=...&speakerId=0&speed=1.0
#   GET  /mica/voice/tts/info
#   POST /mica/voice/speaker/enroll       ?name=alice        file=@a.wav
#   POST /mica/voice/speaker/verify       ?name=alice        file=@b.wav
#   POST /mica/voice/speaker/search file=@test.wav
#   GET  /mica/voice/speaker/names
#   DELETE /mica/voice/speaker/{name}
#   POST /mica/voice/vad/detect           file=@input.wav           (v1.1)
#   POST /mica/voice/diarization/run      file=@input.wav           (v1.1)
#   POST /mica/voice/kws/spot             file=@input.wav           (v1.1)
#   POST /mica/voice/denoise/run          file=@input.wav → wav     (v1.1)
#   POST /mica/voice/denoise/info          file=@input.wav           (v1.1)
# 也提供简洁示例：
#   POST /demo/asr / GET /demo/tts / POST /demo/speaker/enroll

# WebSocket（v1.0 +）:
#   WS /mica/voice/ws/online-asr   浏览器麦克风流式 ASR（参考 static/index.html 录音面板）